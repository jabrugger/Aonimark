<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1628"/>
      <stop offset="100%" stop-color="#173054"/>
    </linearGradient>
    <linearGradient id="fold" x1="308" y1="84" x2="404" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="paper" x1="108" y1="84" x2="404" y2="428" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8eff7"/>
    </linearGradient>
    <clipPath id="hash-clip">
      <polygon points="214,180 240,180 218,326 192,326"/>
      <polygon points="294,180 320,180 298,326 272,326"/>
      <rect x="172" y="214" width="174" height="24" rx="10"/>
      <rect x="164" y="268" width="174" height="24" rx="10"/>
    </clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#38bdf8" stroke-opacity="0.22" stroke-width="4"/>
  <!-- Folded document sheet -->
  <path d="M144 84 H316 L404 172 V392 A36 36 0 0 1 368 428 H144 A36 36 0 0 1 108 392 V120 A36 36 0 0 1 144 84 Z" fill="url(#paper)"/>
  <!-- Sky-blue folded corner -->
  <path d="M316 84 V144 A28 28 0 0 0 344 172 H404 Z" fill="url(#fold)"/>
  <!-- Classic # shape: outer tips in sky-blue, inner A in deep navy -->
  <g clip-path="url(#hash-clip)">
    <rect x="150" y="170" width="212" height="170" fill="url(#fold)"/>
    <g fill="#0f2342">
      <!-- Left and right legs of A (from upper bar to bottom) -->
      <polygon points="209,214 235,214 218,326 192,326"/>
      <polygon points="289,214 315,214 298,326 272,326"/>
      <!-- Top bar and crossbar of A -->
      <rect x="209" y="214" width="106" height="24"/>
      <rect x="200" y="268" width="106" height="24"/>
    </g>
  </g>
  <!-- Sky-blue accent bar -->
  <rect x="166" y="350" width="124" height="22" rx="11" fill="url(#fold)"/>
</svg>
