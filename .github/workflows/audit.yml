name: Audit

# What ships to users, checked when it changes and again before a release.
on:
  pull_request:
    paths:
      - '.github/workflows/audit.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
  push:
    branches:
      - master
    paths:
      - '.github/workflows/audit.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
  workflow_call:

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: audit shipped npm dependencies
        run: npm audit --omit=dev --audit-level=moderate

  cargo:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: audit Rust dependencies
        run: >-
          cargo audit --file src-tauri/Cargo.lock
          --ignore RUSTSEC-2026-0367
          --ignore RUSTSEC-2026-0368
          --ignore RUSTSEC-2026-0369
