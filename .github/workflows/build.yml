name: Build and Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-and-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    uses: ./.github/workflows/audit.yml

  create-release:
    needs: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Get Version
        id: get_version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: This version has not already been released
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${{ steps.get_version.outputs.version }}"

          if answer=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft 2>&1); then
            if [ "$(printf '%s' "$answer" | jq -r '.isDraft')" != "true" ]; then
              echo "::error::$TAG is already published. This run would rewrite that release's assets and its updater feed, not create a new one. Bump the version first -- npm run release X.Y.Z, RELEASING.md per-release step 1."
              exit 1
            fi
            echo "::notice::$TAG already has a draft release. This run writes into it, which is the recovery path."
          elif printf '%s' "$answer" | grep -qi 'not found'; then
            echo "$TAG has no release yet."
          else
            echo "::error::Could not establish whether $TAG is already released, so this run stops rather than guess: $answer"
            exit 1
          fi

      - name: Compose the download table
        id: download_table
        run: |
          VERSION='${{ steps.get_version.outputs.version }}'
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}"
          {
            echo 'body<<RELEASE_BODY'
            echo '## Download'
            echo
            echo '| System | Chip | Download | |'
            echo '|---|---|---|---|'
            echo "| **Windows** | Intel / AMD | [\`Aonimark_${VERSION}_x64-setup.exe\`](${BASE}/Aonimark_${VERSION}_x64-setup.exe) | installer |"
            echo "| | Intel / AMD | [\`Aonimark_${VERSION}_x64.exe\`](${BASE}/Aonimark_${VERSION}_x64.exe) | portable |"
            echo "| | ARM64 | [\`Aonimark_${VERSION}_arm64-setup.exe\`](${BASE}/Aonimark_${VERSION}_arm64-setup.exe) | installer |"
            echo "| | ARM64 | [\`Aonimark_${VERSION}_arm64.exe\`](${BASE}/Aonimark_${VERSION}_arm64.exe) | portable |"
            echo "| **macOS** | Intel **and** Apple Silicon | [\`Aonimark_${VERSION}_universal.dmg\`](${BASE}/Aonimark_${VERSION}_universal.dmg) | one file for both |"
            echo "| **Linux** | x86-64 | [\`Aonimark_${VERSION}_amd64.AppImage\`](${BASE}/Aonimark_${VERSION}_amd64.AppImage) | portable |"
            echo "| | x86-64 | [\`Aonimark_${VERSION}_amd64.deb\`](${BASE}/Aonimark_${VERSION}_amd64.deb) | Debian, Ubuntu |"
            echo "| | x86-64 | [\`Aonimark-${VERSION}-1.x86_64.rpm\`](${BASE}/Aonimark-${VERSION}-1.x86_64.rpm) | Fedora, RHEL, openSUSE |"
            echo
            echo '> [!NOTE]'
            echo '> **Windows SmartScreen Notice**: Windows executables are not signed with an Authenticode certificate, so SmartScreen shows them as an unrecognized app. Click *"More info"* → *"Run anyway"*. The antivirus heuristic that used to flag the portable `.exe` no longer does.'
            echo
            echo 'The two Windows files differ only in that one installs and one does not.'
            echo '---'
            echo 'RELEASE_BODY'
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Aonimark v${{ steps.get_version.outputs.version }}
          draft: true
          prerelease: false
          generate_release_notes: true
          body: ${{ steps.download_table.outputs.body }}

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            os: windows
            arch: x64
            target: ''
            rust_target: ''
          - platform: windows-latest
            os: windows
            arch: arm64
            target: 'aarch64-pc-windows-msvc'
            rust_target: 'aarch64-pc-windows-msvc'
          - platform: ubuntu-24.04
            os: linux
            arch: x64
            target: ''
            rust_target: ''
          - platform: macos-latest
            os: macos
            arch: universal
            target: 'universal-apple-darwin'
            rust_target: 'aarch64-apple-darwin,x86_64-apple-darwin'

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Windows
        if: matrix.os == 'windows'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build ${{ matrix.target && format('-- --target {0}', matrix.target) || '' }}

      - name: Upload Windows Artifacts
        if: matrix.os == 'windows'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.create-release.outputs.version }}"
          OUT="src-tauri/target/${TARGET:+$TARGET/}release"
          PORTABLE="Aonimark_${VERSION}_${{ matrix.arch }}.exe"
          cp "$OUT/Aonimark.exe" "$PORTABLE"
          gh release upload "v$VERSION" "$PORTABLE" "$OUT"/bundle/nsis/*-setup.exe "$OUT"/bundle/nsis/*-setup.exe.sig --clobber

      - name: Build Linux
        if: matrix.os == 'linux'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npm run tauri build

      - name: Strip host-coupled libraries from AppImage
        if: matrix.os == 'linux'
        run: |
          set -euo pipefail
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' | head -1)
          if [ -z "$APPIMAGE" ]; then
            echo "::error::No AppImage found to repackage" >&2
            exit 1
          fi
          echo "APPIMAGE=$(realpath "$APPIMAGE")" >> "$GITHUB_ENV"
          bash scripts/strip-appimage.sh "$APPIMAGE"

      - name: Re-sign the repacked AppImage
        if: matrix.os == 'linux'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          npm run tauri signer sign -- "$APPIMAGE"
          if [ ! -f "$APPIMAGE.sig" ]; then
            echo "::error::signer sign did not produce $APPIMAGE.sig" >&2
            exit 1
          fi
          ls -la "$APPIMAGE" "$APPIMAGE.sig"

      - name: The AppImage starts on a distribution it was not built on
        if: matrix.os == 'linux'
        run: bash scripts/smoke-appimage.sh "$APPIMAGE"

      - name: Upload Linux Artifacts
        if: matrix.os == 'linux'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          B=src-tauri/target/release/bundle
          gh release upload "v${{ needs.create-release.outputs.version }}" "$B"/deb/*.deb "$B"/rpm/*.rpm "$B"/appimage/*.AppImage "$B"/appimage/*.AppImage.sig --clobber

      # Developer ID takes precedence; without it the legacy signing path remains.
      - name: Import macOS signing certificate
        if: matrix.os == 'macos'
        shell: bash
        env:
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}
          APPLE_DEVELOPER_ID_SHA1: ${{ secrets.APPLE_DEVELOPER_ID_SHA1 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          umask 077
          if [ -n "${APPLE_DEVELOPER_ID_P12:-}${APPLE_DEVELOPER_ID_PASSWORD:-}${APPLE_DEVELOPER_ID_SHA1:-}" ]; then
            for name in APPLE_DEVELOPER_ID_P12 APPLE_DEVELOPER_ID_PASSWORD APPLE_DEVELOPER_ID_SHA1 APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
              if [ -z "${!name:-}" ]; then
                echo "::error::Developer ID signing requires $name; refusing to fall back."
                exit 1
              fi
            done
            [[ "$APPLE_DEVELOPER_ID_SHA1" =~ ^[A-Fa-f0-9]{40}$ && "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] || {
              echo '::error::Invalid Developer ID SHA-1 or Apple team ID.'
              exit 1
            }
            MACOS_CERTIFICATE="$APPLE_DEVELOPER_ID_P12"
            MACOS_CERTIFICATE_PASSWORD="$APPLE_DEVELOPER_ID_PASSWORD"
            MACOS_SIGNING_IDENTITY="$(printf '%s' "$APPLE_DEVELOPER_ID_SHA1" | tr '[:lower:]' '[:upper:]')"
            echo 'MACOS_DEVELOPER_ID=true' >> "$GITHUB_ENV"
          fi
          if [ -z "${MACOS_CERTIFICATE:-}" ]; then
            echo "No MACOS_CERTIFICATE secret; leaving the bundle unsigned (unchanged behaviour)."
            exit 0
          fi

          if [ -z "${MACOS_SIGNING_IDENTITY:-}" ]; then
            echo "::error::MACOS_CERTIFICATE is set but MACOS_SIGNING_IDENTITY is empty. Set all three secrets or none -- RELEASING.md one-time setup step 6."
            exit 1
          fi

          KEYCHAIN="$RUNNER_TEMP/aonimark-signing.keychain"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          CERTIFICATE="$RUNNER_TEMP/certificate.p12"
          trap 'rm -f "$CERTIFICATE"' EXIT

          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$CERTIFICATE"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERTIFICATE" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s \
            $(security list-keychains -d user | tr -d '"') "$KEYCHAIN"
          rm -f "$CERTIFICATE"

          if [ -n "${APPLE_DEVELOPER_ID_P12:-}" ]; then
            security find-identity -v -p codesigning "$KEYCHAIN" \
              | awk -v sha="$MACOS_SIGNING_IDENTITY" '$2 == sha && /Developer ID Application/ { found=1 } END { exit !found }'
          fi

          # `tauri build` reads this and signs with it; unset means no signing.
          echo "APPLE_SIGNING_IDENTITY=$MACOS_SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Build MacOS (Universal)
        if: matrix.os == 'macos'
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_ID: ${{ env.MACOS_DEVELOPER_ID == 'true' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ env.MACOS_DEVELOPER_ID == 'true' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ env.MACOS_DEVELOPER_ID == 'true' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          if [ "${MACOS_DEVELOPER_ID:-}" != true ]; then
            unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
          npm run tauri build -- --target universal-apple-darwin

      - name: Verify notarized macOS artifacts
        if: matrix.os == 'macos' && env.MACOS_DEVELOPER_ID == 'true'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          BUNDLE=src-tauri/target/universal-apple-darwin/release/bundle
          REQUIREMENT="anchor apple generic and certificate leaf = H\"$APPLE_SIGNING_IDENTITY\" and certificate leaf[subject.OU] = \"$APPLE_TEAM_ID\""
          APP_ID="$(node -p "require('./src-tauri/tauri.conf.json').identifier")"
          verify_app() {
            codesign --verify --deep --strict -R="$REQUIREMENT and identifier \"$APP_ID\"" "$1"
            xcrun stapler validate "$1"
            spctl -a -t exec "$1"
          }
          verify_app "$BUNDLE/macos/Aonimark.app"
          # Verify the updater's exact archive without changing its minisign signature.
          WORK="$(mktemp -d)"
          trap 'hdiutil detach "$WORK/mount" -quiet 2>/dev/null || true; rm -rf "$WORK"' EXIT
          ARCHIVES=("$BUNDLE"/macos/*.app.tar.gz)
          DMGS=("$BUNDLE"/dmg/*.dmg)
          [[ ${#ARCHIVES[@]} == 1 && ${#DMGS[@]} == 1 ]]
          mkdir "$WORK/archive" "$WORK/mount"
          tar -xzf "${ARCHIVES[0]}" -C "$WORK/archive"
          verify_app "$WORK/archive/Aonimark.app"
          # Tauri notarizes the app. Also staple the downloadable disk image.
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "${DMGS[0]}"
          codesign --verify --strict -R="$REQUIREMENT" "${DMGS[0]}"
          xcrun notarytool submit "${DMGS[0]}" --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "${DMGS[0]}"
          xcrun stapler validate "${DMGS[0]}"
          spctl -a -t open --context context:primary-signature "${DMGS[0]}"
          hdiutil attach "${DMGS[0]}" -readonly -nobrowse -mountpoint "$WORK/mount"
          verify_app "$WORK/mount/Aonimark.app"

      - name: Upload MacOS Artifacts
        if: matrix.os == 'macos'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          B=src-tauri/target/universal-apple-darwin/release/bundle
          gh release upload "v${{ needs.create-release.outputs.version }}" "$B"/dmg/*.dmg "$B"/macos/*.app.tar.gz "$B"/macos/*.app.tar.gz.sig --clobber

  generate-update-feed:
    needs: [create-release, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: ${{ always() && needs.create-release.result == 'success' && needs.build.result == 'success' }}
    steps:
      - name: Generate latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p ./sigs
          gh release download "v$VERSION" --repo "$REPO" --pattern "*.sig" --dir ./sigs

          MAC_SIG=$(ls ./sigs/*.app.tar.gz.sig 2>/dev/null | head -1 || true)
          WIN_X64_SIG=$(ls ./sigs/*x64*-setup.exe.sig 2>/dev/null | head -1 || true)
          WIN_ARM_SIG=$(ls ./sigs/*arm64*-setup.exe.sig 2>/dev/null | head -1 || true)
          LINUX_SIG=$(ls ./sigs/*.AppImage.sig 2>/dev/null | head -1 || true)

          if [ -z "$MAC_SIG" ] || [ -z "$WIN_X64_SIG" ] || [ -z "$WIN_ARM_SIG" ] || [ -z "$LINUX_SIG" ]; then
            echo "ERROR: release v${VERSION} is missing one or more required updater signatures. Aborting before publishing latest.json." >&2
            exit 1
          fi

          platform_entry() {
            local sig_file="$1"
            if [ -z "$sig_file" ] || [ ! -f "$sig_file" ]; then
              printf 'null'
              return
            fi
            local artifact
            artifact=$(basename "${sig_file%.sig}")
            local sig
            sig=$(tr -d '\r\n' < "$sig_file")
            local url="https://github.com/${REPO}/releases/download/v${VERSION}/${artifact}"
            jq -n --arg sig "$sig" --arg url "$url" '{signature: $sig, url: $url}'
          }

          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          DARWIN_AARCH64=$(platform_entry "$MAC_SIG")
          DARWIN_X86_64=$(platform_entry "$MAC_SIG")
          WINDOWS_X86_64=$(platform_entry "$WIN_X64_SIG")
          WINDOWS_AARCH64=$(platform_entry "$WIN_ARM_SIG")
          LINUX_X86_64=$(platform_entry "$LINUX_SIG")

          # Every key below is a plain {os}-{arch}, and that is load-bearing.
          jq -n \
            --arg version "$VERSION" \
            --arg notes "See https://github.com/${REPO}/releases/tag/v${VERSION}" \
            --arg pub_date "$DATE" \
            --argjson darwin_aarch64 "$DARWIN_AARCH64" \
            --argjson darwin_x86_64 "$DARWIN_X86_64" \
            --argjson windows_x86_64 "$WINDOWS_X86_64" \
            --argjson windows_aarch64 "$WINDOWS_AARCH64" \
            --argjson linux_x86_64 "$LINUX_X86_64" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: ({
                "darwin-aarch64":   $darwin_aarch64,
                "darwin-x86_64":    $darwin_x86_64,
                "windows-x86_64":   $windows_x86_64,
                "windows-aarch64":  $windows_aarch64,
                "linux-x86_64":     $linux_x86_64
              } | with_entries(select(.value != null)))
            }' > latest.json

          cat latest.json
          gh release upload "v$VERSION" latest.json --clobber --repo "$REPO"
