name: Test Build (No Release)

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
  # This trigger exists to fill the cargo cache, not to test master again.
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
            os-name: 'macos-universal'
          - platform: 'ubuntu-24.04'
            args: ''
            os-name: 'linux'
          - platform: 'windows-latest'
            args: ''
            os-name: 'windows'

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    env:
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v7

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: install rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os-name == 'macos-universal' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: name the runner image for the cache key
        run: echo "IMAGE_OS=$ImageOS" >> "$GITHUB_ENV"
        shell: bash

      - name: cache rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.os-name }}-${{ env.IMAGE_OS }}
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # Keyed on which entry this is, not on which Ubuntu it happens to be.
      - name: install dependencies (ubuntu only)
        if: matrix.os-name == 'linux'
        run: |
            sudo apt-get update
            sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - name: install frontend dependencies
        run: npm ci

      - name: run frontend behavior tests
        if: matrix.os-name != 'linux'
        shell: bash
        run: npm test

      - name: run cargo test
        if: matrix.os-name != 'linux'
        working-directory: src-tauri
        run: cargo test

      - name: Build app
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npm run tauri build -- --no-sign ${{ matrix.args }}

      - name: The AppImage bundles nothing that has to come from the host
        if: matrix.os-name == 'linux'
        run: |
          set -euo pipefail
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' | head -1)
          if [ -z "$APPIMAGE" ]; then
            echo "::error::the Linux build produced no AppImage to check" >&2
            exit 1
          fi
          bash scripts/check-appimage-libraries.sh "$APPIMAGE"
          echo "APPIMAGE=$(realpath "$APPIMAGE")" >> "$GITHUB_ENV"

      - name: Strip the AppImage, as the release does
        if: matrix.os-name == 'linux'
        run: bash scripts/strip-appimage.sh "$APPIMAGE"

      - name: The AppImage starts on a distribution it was not built on
        if: matrix.os-name == 'linux'
        run: bash scripts/smoke-appimage.sh "$APPIMAGE"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: app-bundle-${{ matrix.os-name }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/*/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/*/release/bundle/macos/*.app
            src-tauri/target/release/*.exe
          if-no-files-found: warn
          retention-days: 7
