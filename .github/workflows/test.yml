name: Test

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: install rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: name the runner image for the cache key
        run: echo "IMAGE_OS=$ImageOS" >> "$GITHUB_ENV"

      - name: cache rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ env.IMAGE_OS }}
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: install dependencies (ubuntu only)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        run: npm ci

      - name: check frontend
        run: npm run check

      - name: lint frontend conventions
        run: npm run lint

      - name: run frontend behavior tests
        run: npm test

      - name: run frontend behavior tests (vitest)
        run: npm run test:vitest

      - name: check rust formatting
        run: |
          cd src-tauri
          cargo fmt --check

      - name: run cargo test
        run: |
          cd src-tauri
          cargo test --locked

      - name: check generated bindings are committed
        run: git diff --exit-code src/lib/bindings.ts

      - name: run clippy
        run: |
          cd src-tauri
          cargo clippy --locked --all-targets -- -D warnings
