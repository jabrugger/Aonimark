name: Question
description: Ask how to do something in Aonimark
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: Discussions are not enabled on this repository, so questions belong here as issues.

  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do, and what have you tried?
    validations:
      required: true

  - type: input
    id: platform-version
    attributes:
      label: Platform and Aonimark version
      placeholder: "Windows 11 · Aonimark 0.1.0"
    validations:
      required: true
